[project]
name = "slova-kotorykh-ne-khvatilo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dstordev", email = "dstordev@icloud.com" }
]
requires-python = ">=3.14.8"
dependencies = [
    "aiogram>=3.31.0",
    "aiogram-dialog>=2.6.0",
    "loguru>=0.7.3",
    "pydantic-settings>=2.16.1",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "RUF", "ASYNC", "SIM", "C4", "ANN"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[project.scripts]
slova-kotorykh-ne-khvatilo = "slova_kotorykh_ne_khvatilo:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
